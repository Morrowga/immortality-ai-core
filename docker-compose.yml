services:
  db:
    image: pgvector/pgvector:pg16
    container_name: immortality_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: immortal2026
      POSTGRES_DB: immortality
    ports:
      - "5432:5432"
    volumes:
      - immortality_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: immortality_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - immortality_redis_data:/data

volumes:
  immortality_db_data:
  immortality_redis_data: